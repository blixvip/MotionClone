name: 🐞 Bug report
description: Something in MotionClone is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Quick checks first:
        - MotionClone is **Windows-first** and needs **Python 3.11+** and **Node.js 22+**.
        - **FFmpeg and ffprobe** must be on your `PATH`, and **Google Chrome** installed.
        - The **Codex CLI** needs to be signed into a ChatGPT account (`codex login`).

        For questions rather than bugs, the [Discord](https://discord.gg/zEB4VjmfSb) is faster.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Reconstruction / rebuilding a reference
        - Scene pipeline and scoring
        - Comparing the rebuild against the original
        - MP4 / recording export
        - Editor (sequences)
        - Saved videos / library
        - Setup, start.ps1, or the server
        - Hosted mode
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: "1. Pasted a link\n2. Chose rebuild mode\n3. The job went to 'error' after a few seconds"
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Reference video
      description: The link or a description of the clip, if that's relevant. Don't attach footage.
  - type: textarea
    id: logs
    attributes:
      label: Logs or console output
      description: Terminal output and/or the browser console (F12). Pasted text is rendered as code.
      render: shell
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04…
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version (`python --version`)
      placeholder: 3.11.9
  - type: input
    id: node
    attributes:
      label: Node.js version (`node -v`)
      placeholder: v22.12.0
  - type: input
    id: commit
    attributes:
      label: Commit or release
      description: "`git rev-parse --short HEAD`, or the release you downloaded."
